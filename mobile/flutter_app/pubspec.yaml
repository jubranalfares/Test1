name: jarvis_app
description: Your personal AI assistant

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  record: ^5.0.4
  audioplayers: ^5.2.1
  flutter_tts: ^3.8.5
  provider: ^6.1.1
  go_router: ^12.1.3
  intl: ^0.18.1
  flutter_animate: ^4.3.0
  permission_handler: ^11.1.0
  path_provider: ^2.1.1
  fl_chart: ^0.66.0
  flutter_markdown: ^0.6.18
  lottie: ^3.0.0
  glassmorphism: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
