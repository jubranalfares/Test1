workflows:
  ios-unsigned:
    name: iOS Unsigned IPA (Sideloadly)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    working_directory: mobile/flutter_app

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: CocoaPods install
        script: cd ios && pod install --repo-update

      - name: Build iOS (Fehler werden als Artifact gespeichert)
        script: |
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build.log
          echo $? > /tmp/build_status.txt
          exit 0

      - name: Ergebnis pruefen und IPA verpacken
        script: |
          STATUS=$(cat /tmp/build_status.txt)
          if [ "$STATUS" = "0" ]; then
            echo "BUILD ERFOLGREICH"
            cd build/ios/iphoneos
            mkdir -p Payload && cp -r Runner.app Payload/
            zip -r Jarvis-unsigned.ipa Payload/ && rm -rf Payload
          else
            echo "BUILD FEHLGESCHLAGEN - Echte Fehler:"
            echo "======================================="
            grep -E "error:|Error \[" /tmp/build.log | grep -v "^note:" | head -30
            echo "======================================="
            echo "Letzte 20 Zeilen des Logs:"
            tail -20 /tmp/build.log
            exit 1
          fi

    artifacts:
      - mobile/flutter_app/build/ios/iphoneos/Jarvis-unsigned.ipa
      - /tmp/build.log

    publishing:
      email:
        recipients:
          - jubranalfares5@gmail.com
        notify:
          success: true
          failure: true
