workflows:
  ios-unsigned:
    name: iOS Unsigned IPA (Sideloadly)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    working_directory: mobile/flutter_app

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: CocoaPods install
        script: cd ios && pod install --repo-update

      - name: Flutter analyze (Dart-Fehler prüfen)
        script: flutter analyze --no-fatal-infos 2>&1 || true

      - name: Build iOS release (unsigned)
        script: |
          flutter build ios --release --no-codesign --verbose 2>&1 | tee /tmp/ios_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "====== FEHLER-ZUSAMMENFASSUNG ======"
          grep -E "error:|Error:|FAILED|fatal error|warning:.*error" /tmp/ios_build.log | tail -40 || true
          echo "====================================="
          exit $BUILD_EXIT

      - name: Package as IPA for Sideloadly
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Jarvis-unsigned.ipa Payload/
          rm -rf Payload

    artifacts:
      - mobile/flutter_app/build/ios/iphoneos/Jarvis-unsigned.ipa
      - /tmp/ios_build.log

    publishing:
      email:
        recipients:
          - jubranalfares5@gmail.com
        notify:
          success: true
          failure: true
