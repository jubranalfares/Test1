workflows:
  ios-unsigned:
    name: iOS Unsigned IPA (Sideloadly)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    working_directory: mobile/flutter_app

    scripts:
      - name: Swift Package Manager deaktivieren
        script: flutter config --no-enable-swift-package-manager

      - name: Flutter pub get
        script: flutter pub get

      - name: CocoaPods install
        script: cd ios && pod install --repo-update

      - name: Build iOS release (unsigned)
        script: flutter build ios --release --no-codesign

      - name: Package as IPA for Sideloadly
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r /tmp/Jarvis-unsigned.ipa Payload/

    artifacts:
      - /tmp/Jarvis-unsigned.ipa

    publishing:
      email:
        recipients:
          - jubranalfares5@gmail.com
        notify:
          success: true
          failure: true
