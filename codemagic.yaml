workflows:
  ios-unsigned:
    name: iOS Unsigned IPA (Sideloadly)
    max_build_duration: 60
    environment:
      flutter: 3.22.3
      xcode: latest
      cocoapods: default

    working_directory: mobile/flutter_app

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: CocoaPods install
        script: cd ios && pod install --repo-update

      - name: Build iOS release (unsigned) + echte Fehlerausgabe
        script: |
          flutter build ios --release --no-codesign --verbose 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "========== ECHTER XCODE FEHLER =========="
            grep -E "error:|Error |FAILED|fatal|linker|ld:" /tmp/build.log \
              | grep -v "note:\|#warning\|^warning" | head -30
            echo "========================================="
            echo "--- Letzte 50 Zeilen ---"
            tail -50 /tmp/build.log
          fi
          exit $BUILD_EXIT

      - name: Package as IPA for Sideloadly
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Jarvis-unsigned.ipa Payload/
          rm -rf Payload

    artifacts:
      - mobile/flutter_app/build/ios/iphoneos/Jarvis-unsigned.ipa
      - /tmp/build.log

    publishing:
      email:
        recipients:
          - jubranalfares5@gmail.com
        notify:
          success: true
          failure: true
