workflows:
  ios-unsigned:
    name: iOS Unsigned IPA (Sideloadly)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    working_directory: mobile/flutter_app

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: CocoaPods install
        script: cd ios && pod install --repo-update

      - name: Build iOS release (unsigned)
        script: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build.log; RESULT=${PIPESTATUS[0]}
          if [ $RESULT -ne 0 ]; then
            echo ""
            echo "############ FEHLER ############"
            grep -E "error:|Error \[|Build FAILED|fatal error" /tmp/build.log | grep -v "^note:" | tail -30
            echo "################################"
            echo "Letzten 30 Zeilen:"
            tail -30 /tmp/build.log
          fi
          exit $RESULT

      - name: Package as IPA for Sideloadly
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Jarvis-unsigned.ipa Payload/
          rm -rf Payload

    artifacts:
      - mobile/flutter_app/build/ios/iphoneos/Jarvis-unsigned.ipa
      - /tmp/build.log

    publishing:
      email:
        recipients:
          - jubranalfares5@gmail.com
        notify:
          success: true
          failure: true
